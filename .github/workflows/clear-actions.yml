name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at midnight
  workflow_dispatch:

concurrency:
  group: clear-actions
  cancel-in-progress: false

permissions:
  actions: write      # ✅ Required to delete workflow runs
  contents: read      # ✅ Minimum needed to access repo contents

jobs:
  delete-runs:
    if: github.repository != 'allistercyber/Control-D-DNS-Automation'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          # Workflow logs are the only forensic record of what this automation
          # did — every commit pushed and every domain added/removed from DNS
          # filtering.  retain_days: 0 deleted that trail daily, leaving no
          # window to investigate a bad sync.  30 days keeps the Actions tab
          # tidy while preserving a usable audit history.
          retain_days: 7
          keep_minimum_runs: 5



