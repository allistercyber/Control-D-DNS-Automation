name: Cleanup Old Workflow Runs

# ── Triggers ─────────────────────────────────────────────────────────────────
# Optional housekeeping, manual only.  Like the sync workflow it ships with no
# cron schedule, so nothing runs automatically in the upstream template.
#
# To run it daily in your fork, uncomment the `schedule:` block below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '41 0 * * *'   # daily at 00:41 UTC

concurrency:
  group: clear-actions
  cancel-in-progress: false

# actions: write is required to delete workflow runs; nothing else is needed.
permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          # Workflow logs are the only forensic record of what the sync did --
          # every commit pushed to the repo.  Keep them long enough to
          # investigate a bad sync (a value of 0 would wipe that trail).
          retain_days: 30
          keep_minimum_runs: 5
