name: Sync Control D folders from upstream

# ── Triggers ─────────────────────────────────────────────────────────────────
# Manual only.  This workflow ships with NO cron schedule so that it never runs
# on its own in the upstream template repository.
#
# To run it automatically in YOUR copy, once config.toml and the secrets are in
# place and a manual run has succeeded, uncomment the `schedule:` block below
# and adjust the times (UTC).  Pick an off-peak minute rather than :00 -- GitHub
# delays or drops scheduled runs at the top of the hour when load is high.
# See README.md, "Enable scheduled runs in your copy".
on:
  workflow_dispatch:
    inputs:
      force_push:
        description: >-
          Push to Control D even if no upstream file changed (use after editing
          config.toml, e.g. to add a new profile/folder target)
        type: boolean
        default: false
  # schedule:
  #   - cron: '23 5,17 * * *'   # 05:23 and 17:23 UTC daily -- edit to taste

# ── Concurrency ──────────────────────────────────────────────────────────────
# Never run two syncs at once, and never cancel one that is part-way through
# talking to the Control D API: a newer run waits for the current one instead.
concurrency:
  group: controld-sync
  cancel-in-progress: false

# ── Permissions ──────────────────────────────────────────────────────────────
# contents: write is needed only to commit the synced JSON files back to the
# repo.  Declaring any permission sets every unlisted scope to "none".
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Checkout without persisting credentials; the sync script hands the token
      # to the single `git push` process through its environment, so it is never
      # written to .git/config.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      # pip itself is pinned and hash-locked in requirements.txt, so it is
      # installed by this same --require-hashes pass rather than fetched
      # unpinned beforehand.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # Fails fast, before any network call, if config.toml is missing or
      # invalid.  This is also what stops the workflow from doing anything in a
      # repository that has not been configured (the upstream template has no
      # config.toml).
      - name: Validate configuration
        run: python scripts/controld_config.py

      # ── Stage 1: Sync files from upstream ──────────────────────────────────
      # Downloads the configured JSON files from hagezi/dns-blocklists, compares
      # them with the local copies, writes changes into the working tree, and
      # sets changed=true/false.  The commit is deferred to Stage 3 on purpose.
      - name: Sync files from upstream
        id: sync
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_PUSH:        ${{ inputs.force_push }}
        run: python scripts/controld_sync.py

      # ── Stage 2: Push domain changes to Control D API ──────────────────────
      # Only runs when Stage 1 detected changes (or force_push was set).
      # The email report, if configured, is sent from within the script before
      # it exits, so it is delivered on success and failure alike.
      #
      # NOTE: an explicit `if:` replaces the implicit `success()` guard, so
      # success() is spelled out here -- without it this step would still run
      # after a failed Stage 1.
      - name: Push changes to Control D API
        if: success() && steps.sync.outputs.changed == 'true'
        env:
          CTRLD_API_TOKEN: ${{ secrets.CTRLD_API_TOKEN }}
          # Optional email report -- see CONFIGURATION.md.
          EMAIL_USERNAME:  ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
        run: |
          if ! python scripts/controld_api_push.py; then
            echo "::error::Control D API push finished with errors. Check the step log."
            exit 1
          fi

      # ── Stage 3: Commit the synced files ───────────────────────────────────
      # Runs only after Stage 2 succeeded, so the repository never records an
      # upstream state that was not actually applied to Control D.  If Stage 2
      # fails the working tree stays uncommitted, so the next run re-detects the
      # same change and retries the API push instead of skipping it as unchanged.
      - name: Commit synced files
        if: success() && steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/controld_sync.py --commit
